{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Registration - Faculty Management System</title>

    <link rel="stylesheet" href="{% static 'style.css' %}">

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #dbeafe 0%,
                #e0e7ff 45%,
                #f0f4ff 100%
            ) !important;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
        }

        .register-box {
            width: 500px;
            max-width: 90%;
            background: white;
            border-radius: 12px;
            overflow: hidden;

            box-shadow:
                0 8px 28px rgba(0, 0, 0, 0.15);
        }

        .register-header {
            background: #183b63;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .register-header .logo {
            font-size: 32px;
            font-weight: bold;
            color: bisque;
        }

        .register-header h1 {
            margin: 8px 0 0;
            font-size: 22px;
        }

        .register-header p {
            margin: 6px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        .register-form {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        .form-group input {
            width: 100%;
            padding: 12px;

            border: 1px solid #ccc;
            border-radius: 6px;

            box-sizing: border-box;

            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.12);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .button-group button {
            flex: 1;
            padding: 13px;

            border: none;
            border-radius: 6px;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
        }

        .btn-register {
            background: #3498db;
            color: white;
        }

        .btn-register:hover {
            background: #2980b9;
        }

        .btn-clear {
            background: #ecf0f1;
            color: #34495e;
        }

        .btn-clear:hover {
            background: #dfe6e9;
        }

        .login-links {
            text-align: center;
            margin-top: 20px;
        }

        .login-links p {
            margin: 0;
            color: #7f8c8d;
            font-size: 14px;
        }

        .login-links a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }

        .login-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 550px) {

            .register-box {
                width: 90%;
            }

            .register-form {
                padding: 25px;
            }

            .button-group {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

    <div class="register-box">

        <div class="register-header">

            <h1>Admin Registration</h1>

            <p>Create your admin account</p>

        </div>


        <div class="register-form">

            <form method="POST">

                {% csrf_token %}


                <div class="form-group">

                    <label for="fullname">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter full name"
                        required>

                </div>


                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose username"
                        required>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter email address"
                        required>

                </div>


                <div class="form-group">

                    <label for="contact">
                        Phone Number
                    </label>

                    <input
                        type="text"
                        id="contact"
                        name="contact"
                        placeholder="Enter phone number"
                        required>

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required>

                </div>


                <div class="form-group">

                    <label for="confirmpassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmpassword"
                        name="confirmpassword"
                        placeholder="Confirm password"
                        required>

                </div>


                <div class="button-group">

                    <button
                        type="submit"
                        class="btn-register">
                        Register
                    </button>

                    <button
                        type="reset"
                        class="btn-clear">
                        Clear
                    </button>

                </div>

            </form>


            <div class="login-links">

                <p>

                    Already have an account?

                    <a href="/">
                        Back to Login
                    </a>

                </p>

            </div>

        </div>

    </div>

</body>


</html>
