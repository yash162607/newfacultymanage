{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Login - FMS</title>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .login-box {
        width: 400px;
        background: white;
        padding: 35px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    .login-box h1 {
        text-align: center;
        color: #2c3e50;
        margin-bottom: 8px;
    }

    .login-box p {
        text-align: center;
        color: #777;
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        color: #333;
        font-weight: bold;
    }

    .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 15px;
    }

    .form-group input:focus {
        outline: none;
        border-color: #3498db;
    }

    .login-btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 5px;
        background: #3498db;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    .login-btn:hover {
        background: #2980b9;
    }

    .error {
        background: #fdecea;
        color: #e74c3c;
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 20px;
        text-align: center;
    }

    .back-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #3498db;
        text-decoration: none;
    }

    .back-link:hover {
        text-decoration: underline;
    }
</style>

</head>

<body>
<div class="login-box">

    <h1>Faculty Login</h1>

    <p>Faculty Management System</p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="faculty_id">Faculty ID</label>
            <input
                type="text"
                id="faculty_id"
                name="faculty_id"
                placeholder="Enter Faculty ID"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter Password"
                required
            >
        </div>

        <button type="submit" class="login-btn">
            Login
        </button>
    </form>

    <a href="{% url 'login' %}" class="back-link">
        Back to Admin Login
    </a>

</div>

</body>
</html>
